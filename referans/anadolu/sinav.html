<script src="assets/js/jquery-1.10.2.js" type="text/javascript"></script>
<script src="assets/js/bootstrap.min.js" type="text/javascript"></script>

<script>


    var puan;
    var dogru;
    var yanlis;
    var bos;
    var gecenZaman;

    var iii = 0;
    var firstTime = true;

    var baseurl = "https://ets-ws.anadolu.edu.tr";
    var otagwsurl = "https://otagws.anadolu.edu.tr";
    //var otagwsurl = "http://localhost:9090";
    //var baseurl = "http://localhost:8085";

    var curUrl = new URL(document.URL);
    var courseCode = curUrl.searchParams.get("courseCode"); // .split("_")[0];

    var vizeFinal = curUrl.searchParams.get("vizeFinal");
    var unite = curUrl.searchParams.get("unite");

    var tc = curUrl.searchParams.get("tc");
    var typefilika = curUrl.searchParams.get("typefilika");
    var btngrp1 = $('#btngrp1');
    var A = $('#optradio1');
    var B = $('#optradio2');
    var C = $('#optradio3');
    var D = $('#optradio4');
    var E = $('#optradio5');
    var correctAns = $('#correctAns');
    var AnswerExplanation = $('#AnswerExplanation');
    var endExam = false;

    var myModalBody = $('#myModalBody');

    var yeniSinav = $('#newExamBtn');
    var finishExamBtn = $('#finishBtn');

    var soruText = $('#soru');

    var currentSoru = -1;

    var Questionss = -1;
    var startDate;
    var endDate;

    var comingData;

    var headerr = '';

    var Authorization = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJldHMtd2Vic2VydmljZXMifQ.EuhtnmabJ9H67LLgchAt6Z75oGjjIXmB3HksUYXCOeM";
    //var Authorization2 = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJldHMtd2Vic2VydmljZXMifQ.EuhtnmabJ9H67LLgchAt6Z75oGjjIXmB3HksUYXCOeM";
    var feedbackForm = $('#questionfeedbackform');

    var whichapi = 'sinavapi';

    if (typefilika) {

        Authorization = curUrl.searchParams.get("filikaAuth");


        if (vizeFinal) {
            // urll = baseurl + "/" + whichapi + "/examservice/createvizefinal/20/" + courseCode + "/" + vizeFinal;
            urll = baseurl + "/v2filikaapi/examservice/createvizefinal/20/" + courseCode + "/" + vizeFinal;
        } else if (unite) {
            urll = baseurl + "/v2filikaapi/examservice/create/10/" + courseCode + "/" + unite;
        }


        //urll = baseurl + "/filikaapi/examservice/createvizefinal/20/" + courseCode + "/" + vizeFinal;
        whichapi = 'v2filikaapi';

    }


    var getButton = function (i) {
        return '<button type="button" id="btn' + i + '"  data-value="' + i + '" class="mybtn btn btn-default"' + '>' + i + '</button>';
    };


    var disableBtns = function () {
        $('.myradio').attr('disabled', true);
    };


    var enableBtns = function () {
        $('.myradio').attr('disabled', false);
    };


    var startNewExam = function () {
        myModalBody.empty();
        endExam = false;
        currentSoru = -1;
        Questionss = -1;
        startDate = null;
        endDate = null;
        btngrp1.empty();
        correctAns.hide();
        // $('#alertid').hide();
        AnswerExplanation.hide();
        feedbackForm.hide();
        getQuestions();

    };


    var noQuestion = function (message) {
        $('#mycont').empty();
        $('#mycont').append('<h1>' + message + '</h1>');
    };


    var openCloseAnswer = function (statuss) {
        if (statuss){
            correctAns.show();
            AnswerExplanation.show();

        }else{
            correctAns.hide();
            AnswerExplanation.hide();
        }

    };


    var setSoru = function (questions, i) {


        var btnn = $('#' + 'btn' + (currentSoru + 1));

        btnn.removeClass('focus');


        soruText.html(i + 1 + " ) " + stripPTag(questions[i].Text));
        A.html(stripPTag(questions[i].A));
        B.html(stripPTag(questions[i].B));
        C.html(stripPTag(questions[i].C));
        D.html(stripPTag(questions[i].D));
        E.html(stripPTag(questions[i].E));
        currentSoru = i;

        if (questions[i].UserAnswer == null) {

            $('.myradio').prop("checked", false);
        } else {

            var opt = 'opt' + questions[i].UserAnswer;
            $('#' + opt).prop("checked", true);
        }
        correctAns.text('Doğru Cevap : ' + questions[i].CorrectAnswer);

        if (questions[i].AnswerExplanation != "" && questions[i].AnswerExplanation != null) {

            //console.log()
            // AnswerExplanation.text('Açıklama : '+questions[i].AnswerExplanation);
            AnswerExplanation.text('Açıklama : ');
            AnswerExplanation.append($.parseHTML(questions[i].AnswerExplanation));
        } else {
            AnswerExplanation.text('');

        }

        // $('#alertid').hide();

        //if (endExam ){
        if (endExam && typefilika) {
            $('#feedbackFormControlTextarea1').val('');
            feedbackForm.show();
        }

        if (endExam && questions[i].UserAnswer != questions[i].CorrectAnswer) {
            correctAns.show();
            AnswerExplanation.show();

        } else {
            correctAns.hide();
            AnswerExplanation.hide();
        }


        btnn = $('#' + 'btn' + (currentSoru + 1));

        btnn.addClass('focus');


    };


    var getQuestions = function () {
        yeniSinav.hide();
        finishExamBtn.show();
        enableBtns();
        //console.log(iii);
        //iii++;


        var urll = '';

        if (vizeFinal) {
            urll = baseurl + "/" + whichapi + "/examservice/createvizefinal/20/" + courseCode + "/" + vizeFinal;
        } else if (unite) {
            urll = baseurl + "/" + whichapi + "/examservice/create/10/" + courseCode + "/" + unite;
        }

        if (!typefilika) {
            urll += "?tc=" + tc;
        }


        $.ajax({
            type: 'GET',
            url: urll,

            headers: {
                "Authorization": Authorization
            },

            success: function (ret) {

                //   console.log(ret);

                if (ret.ErrMessage != undefined) {
                    //console.log(ret.ErrMessage);
                    //noQuestion("Bu derse kayıtlı değilsiniz ya da bir hata oluştu !!!");
                    noQuestion(ret.ErrMessage);
                    return;
                }


                if (ret.Questions == undefined || ret.Questions.length == 0) {
                    noQuestion('Bu dersle ilgili soru bulunamadı!!!');
                    return;
                }

                Questionss = ret.Questions;
                comingData = ret;

                //console.log(ret);
                // console.log(iii, " ) len : ", ret.Questions.length);
                // btngrp1.empty();
                // iii++;

                for (var i = 1; i <= ret.Questions.length; i++) {
                    btngrp1.append(getButton(i));

                }
                init();

                setSoru(Questionss, 0);
                startDate = new Date();
                //finishExamFunc();
            },

            error: function (ret) {
                console.log("burada", ret);
                noQuestion('bir hata oluştu : '+ret.responseText);
            }
        });

    };


    var init = function () {

        headerr = courseCode + ' - ' + comingData.CourseName + ' \n';
        if (vizeFinal) {
            if (vizeFinal == '1') {
                headerr += '</br>Ara Sınav Deneme Sınavı';
            } else {
                headerr += '</br>Dönem Sonu Deneme Sınavı';
            }

        } else if (unite) {
            headerr += '</br>Ünite ' + unite + ' - Alıştırma Soruları';
        }

        console.log(headerr);

        $('#headerrCourse').html(headerr);


        $('.mybtn').on('click', function () {
            setSoru(Questionss, $(this).data('value') - 1);

        });

    };

    var sendFeedBackFunc = function () {

        $.ajax({
            type: 'POST',

            data: {
                question_id: Questionss[currentSoru].QuestionId,
                feedback_text: $('#feedbackFormControlTextarea1').val(),
                course_code: courseCode,
                question_type: "1",
                unite_no: Questionss[currentSoru].UniteNo
            },

            url: otagwsurl + '/v2/materialfeedback/postquestionfeedback',
            headers: {
                "Authorization": Authorization
            },

            success: function (ret) {
                console.log("gönderildi !!! :)");
                $('#feedbackFormControlTextarea1').val('');
                alert("Soru ile ilgili geri bildiriminiz iletildi.")
                // $('.alert').show();
                // $('.alert').alert();


            },

            error: function (ret) {
                console.log("burada 2", ret);
                alert(ret.responseText)

            }


        });


    };


    var initEvents = function () {
        // $('#newExamBtn').on('click', function () {
        //     startNewExam();
        // });


        $('.myradio').on('click', function () {

            Questionss[currentSoru].UserAnswer = $(this).data('value');
            var btnn = $('#' + 'btn' + (currentSoru + 1));
            btnn.removeClass("btn-default");
            btnn.addClass("btn-info");


        });

        $('.btnnext').on('click', function () {
            if (currentSoru == Questionss.length - 1) {
                setSoru(Questionss, 0);
            } else {
                setSoru(Questionss, currentSoru + 1);
            }

        });


        $('.btnprev').on('click', function () {
            if (currentSoru == 0) {
                setSoru(Questionss, Questionss.length - 1);
            } else {
                setSoru(Questionss, currentSoru - 1);
            }

        });


        $('#pdfBtn').on('click', function () {
            //console.log("qs : ",Questionss);
            if (CheckQuestions(Questionss, courseCode)) {
                //   if (true){
                PDFExport2(Questionss, vizeFinal, unite, courseCode, comingData.CourseName, baseurl, Authorization, comingData.RandPart, typefilika);
            } else {
                PDFExport(Questionss, vizeFinal, unite, courseCode, comingData.CourseName);
            }


        });


        $('#pdfWithSolBtn').on('click', function () {
            PDFExport3(Questionss, vizeFinal, unite, courseCode, comingData.CourseName, baseurl, Authorization, comingData.RandPart, typefilika);
        });



        $('#sendquestionfeedbackbutton').on('click', function () {
            sendFeedBackFunc();
        });


        $('#solutionbutton').on('click',function () {

            if($('#correctAns').is(':visible')){

                openCloseAnswer(false);

            }else{
                openCloseAnswer(true);
            }

        });


        // finishExamFunc();


    };

    finishExamBtn.confirmation({
        onConfirm: function () {
            finishExamFunc();
        }
    });


    yeniSinav.confirmation({
        onConfirm: function () {
            startNewExam();
        }
    });


    var finishExamFunc = function () {


        // $('#finishBtn').on('click', function () {

        if (endExam) {
            return;
        }


        finishExamBtn.hide();
        yeniSinav.show();
        disableBtns();

        endExam = true;
        endDate = new Date();

        bos = 0;
        yanlis = 0;
        dogru = 0;

        for (var i = 0; i < Questionss.length; i++) {

            var btnn = $('#' + 'btn' + (i + 1));
            btnn.removeClass("btn-default");
            btnn.removeClass("btn-info");

            if (Questionss[i].UserAnswer == null) {
                bos++;

            } else if (Questionss[i].UserAnswer == Questionss[i].CorrectAnswer) {
                dogru++;
                btnn.removeClass("btn-info");
                btnn.addClass("btn-success");
            } else {
                yanlis++;
                btnn.removeClass("btn-info");
                btnn.addClass("btn-danger");

            }


        }

        var diff = (endDate.getTime() - startDate.getTime());

        var minutes = Math.floor(diff / 60000);

        var seconds = Math.floor((diff - minutes * 60000) / 1000);


        var sorupuan = 100 / Questionss.length;

        var nett = dogru - (yanlis / 4);
        if (nett < 0) {
            nett = 0;
        }

        puan = nett * sorupuan;

        gecenZaman = 'Süre  : ' + minutes + ' dakika ' + seconds + ' saniye';


        myModalBody.append('<li>' + 'Puan  : ' + puan + '</li>');
        myModalBody.append('<li>' + 'Doğru  : ' + dogru + '</li>');
        myModalBody.append('<li>' + 'Yanlış  : ' + yanlis + '</li>');
        myModalBody.append('<li>' + 'Boş  : ' + bos + '</li>');
        myModalBody.append('<li>' + gecenZaman + '</li>');

        $("#myModal").modal();

        gecenZaman = (minutes * 60) + seconds + '';

        saveResults();

        setSoru(Questionss, currentSoru);


        // });

    };


    var saveResults = function () {


        var qdata = [];

        for (var i = 0; i < Questionss.length; i++) {

            qdata.push({QuestionId: Questionss[i].QuestionId, Answer: Questionss[i].UserAnswer});

        }


        var vizeFinal2 = vizeFinal;
        if (vizeFinal2==null){
            vizeFinal2="0";
        }

        var mydata = {
            CourseCode: comingData.CourseCode,
            Chapters: comingData.Chapters,
            Duration: gecenZaman,
            TotalQuestionCount: Questionss.length,
            RightCount: dogru,
            WrongCount: yanlis,
            EmptyCount: bos,
            Score: puan,
            Questions: qdata
        };

        var saveurl = "";

        if (typefilika) {
            saveurl = baseurl + "/" + whichapi + "/examservice/saveresult?vizefinal="+vizeFinal2;
        } else {
            saveurl = baseurl + "/" + whichapi + "/examservice/saveresult?tc=" + tc+"&vizefinal="+vizeFinal2;
        }


        //console.log("gdfgdfgdfgdfgdf", mydata);
        $.ajax({
            type: 'POST',

            data: JSON.stringify(mydata),
            contentType: "application/json",

            // dataType: 'json',
            // contentType: 'application/json; charset=UTF-8', // This is the money shot
            //  data: mydata,
            url: saveurl,
            headers: {
                "Authorization": Authorization
            },

            success: function (ret) {
                //      console.log("kaydedildi");

            }
        });


    };


    $('document').ready(function () {
        //correctAns.hide();
        //getQuestions();
        // init();
        startNewExam();
        initEvents();

        $('[data-toggle=confirmation]').confirmation({
            rootSelector: '[data-toggle=confirmation]'
            // other options
        });

    });


</script>


</html>
